version: '3.8'

services:
  # Backend Flask service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tennis-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=src.main:create_app
      - FLASK_ENV=development
      - DATABASE_URI=mysql+pymysql://tennis_user:tennis_password@db:3306/tennis_db
      - JWT_SECRET_KEY=change_this_in_production
      - CORS_ORIGINS=http://localhost:80,http://localhost:8080
    volumes:
      - ./backend/src:/app/src
      - ./backend/migrations:/app/migrations
    depends_on:
      - db
    networks:
      - tennis-network

  # Frontend Nginx service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tennis-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - tennis-network

  # MySQL Database service
  db:
    image: mysql:8.0
    container_name: tennis-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=tennis_db
      - MYSQL_USER=tennis_user
      - MYSQL_PASSWORD=tennis_password
    ports:
      - "3306:3306"
    volumes:
      - tennis-db-data:/var/lib/mysql
    networks:
      - tennis-network
    command: --default-authentication-plugin=mysql_native_password

  # Database management tool (optional)
  adminer:
    image: adminer
    container_name: tennis-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - db
    networks:
      - tennis-network

networks:
  tennis-network:
    driver: bridge

volumes:
  tennis-db-data:
    driver: local
