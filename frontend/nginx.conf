server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index signup_login.html index.html index.htm; # Prioritize signup_login.html as the main entry point

    location / {
        try_files $uri $uri/ /signup_login.html; # Fallback for SPA-like behavior if needed
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: Add headers to prevent caching during development
    # location ~* \.(?:css|js)$ {
    #     expires -1;
    #     add_header Pragma "no-cache";
    #     add_header Cache-Control "no-store, no-cache, must-revalidate, post-check=0, pre-check=0";
    # }
}
