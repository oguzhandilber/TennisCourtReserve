<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CourtReserve - Court Details</title>
    <link rel="stylesheet" href="common_styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Page-specific styles for Court Detail */
        .court-image-carousel {
            width: 100%;
            height: 250px;
            /* Fixed height for carousel */
            background-color: #e0e0e0;
            /* Placeholder */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            /* For multiple images later */
        }

        .court-image-carousel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .court-info-section {
            padding: 24px 16px;
        }

        .court-info-section h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .court-meta-details span {
            display: inline-block;
            background-color: #E9ECEF;
            /* Light Grey */
            color: #343A40;
            /* Charcoal Grey */
            padding: 6px 10px;
            border-radius: 16px;
            /* Pill shape */
            font-size: 12px;
            font-weight: 500;
            margin-right: 8px;
            margin-bottom: 12px;
        }

        .court-description {
            font-size: 15px;
            color: #6C757D;
            margin-bottom: 24px;
            line-height: 1.7;
        }

        .trainer-info {
            margin-bottom: 24px;
        }

        .trainer-info h3 {
            font-size: 16px;
            margin-bottom: 8px;
        }

        .trainer-chip {
            display: inline-flex;
            /* To align avatar and name */
            align-items: center;
            background-color: #F8F9FA;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #E9ECEF;
            font-size: 14px;
            color: #27677A;
            cursor: pointer;
        }

        .trainer-chip img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .availability-section {
            padding: 0 16px 24px 16px;
        }

        .availability-section h2 {
            font-size: 20px;
            margin-bottom: 16px;
        }

        .booking-action-bar {
            position: sticky;
            bottom: 0;
            background-color: #FFFFFF;
            padding: 16px;
            border-top: 1px solid #E9ECEF;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.05);
            z-index: 1000;
        }

        .selected-slot-info {
            font-size: 14px;
            color: #6C757D;
            margin-bottom: 12px;
            text-align: center;
        }

        .selected-slot-info strong {
            color: #343A40;
        }

        .time-slot.booked {
            background-color: #f8d7da;
            /* Light red for booked slots */
            color: #721c24;
            cursor: not-allowed;
            border-color: #f5c6cb;
        }

        .time-slot.pending_approval {
            background-color: #fff3cd;
            /* Light yellow for pending */
            color: #856404;
            cursor: not-allowed;
            border-color: #ffeeba;
        }

        .time-slot.available.selected {
            background-color: #007bff;
            /* Or your primary color */
            color: white;
        }

        /* Loading spinner */
        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top-color: #007bff;
            animation: spin 1s ease-in-out infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-container {
            text-align: center;
            padding: 20px;
        }

        .error-message {
            color: #721c24;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <a href="court_listing.html" class="nav-icon" style="text-decoration:none; font-size: 20px;">&larr;</a>
            <!-- Back Arrow -->
            <div class="logo" style="margin: 0 auto; padding-left: 20px;" id="court-name-header">Court Details</div>
            <!-- Centered Title -->
            <div class="nav-icon" onclick="toggleFollowCourt()" id="favorite-icon">☆</div> <!-- Favorite Icon -->
        </header>

        <main style="padding: 0;">
            <section class="court-image-carousel">
                <img src="https://via.placeholder.com/480x250.png?text=Court+Image+Detail" alt="Court Image"
                    id="court-main-image">
            </section>

            <section class="court-info-section">
                <h1 id="court-name-main">Loading Court...</h1>
                <div class="court-meta-details">
                    <span id="court-surface">-</span>
                    <span id="court-setting">-</span>
                    <span id="court-feature">-</span>
                </div>
                <p class="court-description" id="court-description">
                    Loading description...
                </p>

                <div class="trainer-info" id="trainer-info-container" style="display:none;">
                    <h3>Assigned Trainer(s)</h3>
                    <div id="trainer-list">
                        <!-- Trainers will be populated here -->
                    </div>
                </div>
            </section>

            <section class="availability-section">
                <h2>Select Date & Time</h2>
                <div class="calendar-controls">
                    <button id="prev-month-btn">&lt; Prev</button>
                    <span class="calendar-month-year" id="current-month-year">May 2025</span>
                    <button id="next-month-btn">Next &gt;</button>
                </div>
                <div class="calendar-grid" id="calendar-grid">
                    <!-- JS will populate this -->
                </div>

                <div class="time-slots-container" id="time-slots-container" style="display: none;">
                    <h4>Available Slots for <span id="selected-date-span"></span>:</h4>
                    <div id="time-slots-list">
                        <!-- JS will populate this -->
                    </div>
                </div>
            </section>
        </main>

        <div class="booking-action-bar" id="booking-action-bar" style="display: none;">
            <div class="selected-slot-info" id="selected-slot-info">
                Selected: <strong id="slot-summary-text"></strong>
            </div>
            <button class="btn btn-primary btn-full-width" id="request-booking-btn" onclick="openBookingModal()"
                disabled>Request Booking</button>
        </div>

        <!-- Booking Confirmation Modal -->
        <div class="modal-overlay" id="booking-confirmation-modal">
            <div class="modal-container">
                <div class="modal-header">
                    <h3>Confirm Your Booking</h3>
                    <button class="modal-close-btn" onclick="closeBookingModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <p>You are about to request the following slot:</p>
                    <p><strong>Court:</strong> <span id="modal-court-name"></span></p>
                    <p><strong>Date:</strong> <span id="modal-selected-date"></span></p>
                    <p><strong>Time:</strong> <span id="modal-selected-time"></span></p>
                    <div class="form-group mt-2">
                        <label for="booking-note">Add a note (optional):</label>
                        <textarea id="booking-note" class="form-input" rows="3"
                            placeholder="Any special requests?"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="closeBookingModal()">Cancel</button>
                    <button class="btn btn-primary" onclick="confirmBookingRequest()">Send Request</button>
                </div>
            </div>
        </div>

        <div id="toast-notification" class="toast">
            <span id="toast-message"></span>
        </div>

    </div>

    <script>
        const API_BASE_URL = "http://127.0.0.1:5000/api"; // Backend runs on port 5000
        const calendarGrid = document.getElementById("calendar-grid");
        const currentMonthYearEl = document.getElementById("current-month-year");
        const timeSlotsContainer = document.getElementById("time-slots-container");
        const timeSlotsList = document.getElementById("time-slots-list");
        const selectedDateSpan = document.getElementById("selected-date-span");
        const bookingActionBar = document.getElementById("booking-action-bar");
        const slotSummaryText = document.getElementById("slot-summary-text");
        const requestBookingBtn = document.getElementById("request-booking-btn");

        const bookingConfirmationModal = document.getElementById("booking-confirmation-modal");
        const modalCourtName = document.getElementById("modal-court-name");
        const modalSelectedDate = document.getElementById("modal-selected-date");
        const modalSelectedTime = document.getElementById("modal-selected-time");

        const toastNotification = document.getElementById("toast-notification");
        const toastMessage = document.getElementById("toast-message");
        const favoriteIcon = document.getElementById("favorite-icon");

        let courtIdGlobal = null;
        let currentCourtDetails = null; // To store fetched court details
        let currentDate = new Date(); // Start with current month
        currentDate.setDate(1); // Set to the first day of the month to avoid month skipping issues
        let selectedDateStr = null;
        let selectedTimeStr = null;
        let isCourtFollowed = false;

        function getAuthToken() {
            return localStorage.getItem("access_token");
        }

        async function fetchWithAuth(url, options = {}) {
            const token = getAuthToken();
            const headers = {
                ...options.headers,
                "Content-Type": "application/json",
            };
            if (token) {
                headers["Authorization"] = `Bearer ${token}`;
            }
            try {
                const response = await fetch(url, { ...options, headers });
                if (response.status === 401) { // Unauthorized
                    showToast("Session expired. Please log in again.", true);
                    localStorage.removeItem("access_token");
                    localStorage.removeItem("user_info");
                    window.location.href = "signup_login.html";
                    return null;
                }
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({ error: "Request failed with status: " + response.status }));
                    showToast(errorData.error || errorData.message || `Error: ${response.status}`, true);
                    return null;
                }
                if (response.status === 204) { // No Content
                    return { success: true };
                }
                return response.json();
            } catch (error) {
                console.error("API Fetch Error:", error);
                showToast("Network error or server unavailable.", true);
                return null;
            }
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            courtIdGlobal = urlParams.get("courtId");
            if (!courtIdGlobal) {
                showToast("Court ID is missing.", true);
                document.getElementById("court-name-main").textContent = "Court not found";
                return;
            }
            if (!getAuthToken()) {
                window.location.href = "signup_login.html?redirect=" + encodeURIComponent(window.location.pathname + window.location.search);
                return;
            }
            await loadCourtDetails();
            renderCalendar(); // Initial calendar render for the current month
        });

        async function loadCourtDetails() {
            // Show loading state
            document.getElementById("court-name-main").textContent = "Loading...";
            document.getElementById("court-description").textContent = "Loading court details...";

            try {
                currentCourtDetails = await fetchWithAuth(`${API_BASE_URL}/courts/${courtIdGlobal}`);

                if (currentCourtDetails) {
                    document.getElementById("court-name-header").textContent = currentCourtDetails.name;
                    document.getElementById("court-main-image").src = currentCourtDetails.thumbnail_url || "https://via.placeholder.com/480x250.png?text=Court+Image";
                    document.getElementById("court-main-image").alt = currentCourtDetails.name + " Image";
                    document.getElementById("court-name-main").textContent = currentCourtDetails.name;
                    document.getElementById("court-surface").textContent = currentCourtDetails.surface_type || "N/A";
                    document.getElementById("court-setting").textContent = currentCourtDetails.setting || "N/A";
                    // Feature might not be directly in API
                    document.getElementById("court-feature").textContent = currentCourtDetails.feature || "Tennis";
                    document.getElementById("court-description").textContent = currentCourtDetails.description || "No description available.";
                    modalCourtName.textContent = currentCourtDetails.name;
                    isCourtFollowed = currentCourtDetails.is_followed_by_current_user;
                    updateFavoriteIcon();

                    // TODO: Populate trainers if API provides this info with court details
                    // const trainerInfoContainer = document.getElementById("trainer-info-container");
                    // const trainerList = document.getElementById("trainer-list");
                    // if (currentCourtDetails.trainers && currentCourtDetails.trainers.length > 0) {
                    //     trainerList.innerHTML = ""; // Clear previous
                    //     currentCourtDetails.trainers.forEach(trainer => {
                    //         const chip = document.createElement("div");
                    //         chip.className = "trainer-chip";
                    //         chip.innerHTML = `<img src="${trainer.profile_picture_url || 'https://via.placeholder.com/24x24.png?text=T'}" alt="${trainer.full_name}"> <span>${trainer.full_name}</span>`;
                    //         // chip.onclick = () => viewTrainerProfile(trainer.id);
                    //         trainerList.appendChild(chip);
                    //     });
                    //     trainerInfoContainer.style.display = "block";
                    // } else {
                    //     trainerInfoContainer.style.display = "none";
                    // }
                } else {
                    showToast("Failed to load court details.", true);
                    document.getElementById("court-name-main").textContent = "Error loading court";
                    document.getElementById("court-description").textContent = "Could not load court details. Please try again later.";
                }
            } catch (error) {
                console.error("Error loading court details:", error);
                showToast("Error loading court details.", true);
                document.getElementById("court-name-main").textContent = "Error loading court";
                document.getElementById("court-description").textContent = "An error occurred while loading court details.";
            }
        }

        function updateFavoriteIcon() {
            favoriteIcon.textContent = isCourtFollowed ? "★" : "☆"; // Filled star if followed
            favoriteIcon.style.color = isCourtFollowed ? "#FFD700" : ""; // Gold color for followed
        }

        async function toggleFollowCourt() {
            if (!currentCourtDetails) return;
            const endpoint = isCourtFollowed ? `/courts/${courtIdGlobal}/unfollow` : `/courts/${courtIdGlobal}/follow`;
            const result = await fetchWithAuth(`${API_BASE_URL}${endpoint}`, { method: "POST" });
            if (result && result.message) {
                showToast(result.message);
                isCourtFollowed = !isCourtFollowed;
                updateFavoriteIcon();
            } else {
                showToast("Failed to update follow status.", true);
            }
        }

        function renderCalendar() {
            calendarGrid.innerHTML = "";
            const month = currentDate.getMonth();
            const year = currentDate.getFullYear();
            currentMonthYearEl.textContent = `${currentDate.toLocaleString("default", { month: "long" })} ${year}`;

            const firstDayOfMonth = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            const dayHeaders = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
            dayHeaders.forEach(day => {
                const headerCell = document.createElement("div");
                headerCell.classList.add("calendar-header-cell");
                headerCell.textContent = day;
                calendarGrid.appendChild(headerCell);
            });

            for (let i = 0; i < firstDayOfMonth; i++) {
                calendarGrid.appendChild(document.createElement("div"));
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dayCell = document.createElement("div");
                dayCell.classList.add("calendar-day-cell");
                dayCell.textContent = day;
                const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;

                // Mark day as potentially available for selection, actual slots fetched on click
                dayCell.classList.add("selectable-day");
                dayCell.onclick = () => selectDate(dayCell, dateStr);

                const today = new Date();
                if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                    dayCell.classList.add("today");
                }
                if (dateStr === selectedDateStr) {
                    dayCell.classList.add("selected");
                }
                calendarGrid.appendChild(dayCell);
            }
            // After rendering calendar, if a date was previously selected for this month, fetch its slots
            if (selectedDateStr && selectedDateStr.startsWith(`${year}-${String(month + 1).padStart(2, "0")}`)) {
                const dayCell = Array.from(calendarGrid.children).find(c => c.textContent === new Date(selectedDateStr + "T00:00:00").getDate().toString() && c.classList.contains('calendar-day-cell'));
                if (dayCell) selectDate(dayCell, selectedDateStr, true); // true to indicate it's a re-render
            }
        }

        document.getElementById("prev-month-btn").onclick = () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            clearSlotSelection(); // Clear time slots when month changes
            renderCalendar();
        };
        document.getElementById("next-month-btn").onclick = () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            clearSlotSelection();
            renderCalendar();
        };

        async function selectDate(cell, dateStr, isRerender = false) {
            if (!isRerender) { // Only reset time if it's a new date selection, not a re-render of existing selection
                selectedTimeStr = null;
            }
            selectedDateStr = dateStr;

            document.querySelectorAll(".calendar-day-cell.selected").forEach(c => c.classList.remove("selected"));
            if (cell) cell.classList.add("selected");

            selectedDateSpan.textContent = new Date(dateStr + "T00:00:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });

            // Show loading state
            timeSlotsList.innerHTML = `
                <div class="loading-container">
                    <div class="loading-spinner"></div>
                    <p>Loading available slots...</p>
                </div>
            `;
            timeSlotsContainer.style.display = "block";
            updateBookingActionState(); // Disable button while loading

            try {
                const availabilityData = await fetchWithAuth(`${API_BASE_URL}/courts/${courtIdGlobal}/availability?date=${dateStr}`);
                timeSlotsList.innerHTML = ""; // Clear loading message

                if (availabilityData && availabilityData.available_slots) {
                    if (availabilityData.available_slots.length > 0) {
                        availabilityData.available_slots.forEach(slot => {
                            const slotEl = document.createElement("div");
                            slotEl.classList.add("time-slot");
                            slotEl.textContent = `${slot.time} - ${calculateEndTime(slot.time)}`;
                            slotEl.dataset.time = slot.time; // Store time for booking
                            slotEl.classList.add(slot.status); // 'available', 'booked', 'pending_approval'

                            if (slot.status === "available") {
                                slotEl.onclick = () => selectTime(slotEl, slot.time);
                            } else {
                                // For booked or pending slots, show status and offer waitlist
                                slotEl.style.cursor = "not-allowed";
                                if (slot.booked_by_current_user) {
                                    slotEl.textContent += " (Your Booking)";
                                    slotEl.classList.add("user-booked");
                                } else {
                                    // Add a button to join waitlist
                                    const waitlistBtn = document.createElement("button");
                                    waitlistBtn.classList.add("btn", "btn-secondary", "btn-small", "ml-auto"); // Add some styling classes
                                    waitlistBtn.textContent = "Join Waitlist";
                                    waitlistBtn.onclick = (event) => {
                                        event.stopPropagation(); // Prevent slot selection click
                                        joinWaitlist(courtIdGlobal, selectedDateStr, slot.time, calculateEndTime(slot.time));
                                    };
                                    // Create a container to hold slot text and button
                                    const slotContent = document.createElement("div");
                                    slotContent.style.display = "flex";
                                    slotContent.style.justifyContent = "space-between";
                                    slotContent.style.alignItems = "center";
                                    slotContent.innerHTML = `<span>${slot.time} - ${calculateEndTime(slot.time)}</span>`;
                                    slotContent.appendChild(waitlistBtn);
                                    slotEl.innerHTML = ''; // Clear original text
                                    slotEl.appendChild(slotContent); // Append new content
                                }
                            }
                            if (slot.time === selectedTimeStr && slot.status === "available") { // Re-select if it was selected
                                slotEl.classList.add("selected");
                            }
                            timeSlotsList.appendChild(slotEl);
                        });
                    } else {
                        timeSlotsList.innerHTML = "<p>No slots available for this date.</p>";
                    }
                } else {
                    timeSlotsList.innerHTML = `
                        <div class="error-message">
                            <p>Could not load time slots. Please try again later.</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error("Error fetching availability:", error);
                timeSlotsList.innerHTML = `
                    <div class="error-message">
                        <p>Error loading time slots: ${error.message || "Unknown error"}</p>
                    </div>
                `;
            }

            updateBookingActionState();
        }

        function calculateEndTime(startTime) {
            const [hours, minutes] = startTime.split(":").map(Number);
            const date = new Date();
            date.setHours(hours, minutes, 0, 0);
            date.setMinutes(date.getMinutes() + 60); // Standard 1-hour slots
            return `${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
        }

        function selectTime(slotEl, timeStr) {
            selectedTimeStr = timeStr;
            document.querySelectorAll(".time-slot.selected").forEach(s => s.classList.remove("selected"));
            slotEl.classList.add("selected");
            updateBookingActionState();
        }

        function clearSlotSelection() {
            selectedDateStr = null;
            selectedTimeStr = null;
            timeSlotsContainer.style.display = "none";
            timeSlotsList.innerHTML = "";
            document.querySelectorAll(".calendar-day-cell.selected").forEach(c => c.classList.remove("selected"));
            updateBookingActionState();
        }

        function updateBookingActionState() {
            if (selectedDateStr && selectedTimeStr) {
                slotSummaryText.textContent = `${new Date(selectedDateStr + 'T' + selectedTimeStr).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "numeric", hour12: true })}`;
                bookingActionBar.style.display = "block";
                requestBookingBtn.disabled = false;
            } else {
                bookingActionBar.style.display = "none";
                requestBookingBtn.disabled = true;
            }
        }

        function openBookingModal() {
            if (!selectedDateStr || !selectedTimeStr || !currentCourtDetails) return;
            modalSelectedDate.textContent = new Date(selectedDateStr + "T00:00:00").toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
            modalSelectedTime.textContent = `${selectedTimeStr} - ${calculateEndTime(selectedTimeStr)}`;
            document.getElementById("booking-note").value = ""; // Clear previous note
            bookingConfirmationModal.style.display = "flex";
        }

        function closeBookingModal() {
            bookingConfirmationModal.style.display = "none";
        }

        async function confirmBookingRequest() {
            if (!courtIdGlobal || !selectedDateStr || !selectedTimeStr) {
                showToast("Missing booking information.", true);
                return;
            }

            // Disable the confirm button and show loading state
            const confirmButton = document.querySelector(".modal-footer .btn-primary");
            const originalButtonText = confirmButton.textContent;
            confirmButton.disabled = true;
            confirmButton.textContent = "Sending...";

            const note = document.getElementById("booking-note").value;
            const bookingData = {
                court_id: parseInt(courtIdGlobal),
                date: selectedDateStr,
                time: selectedTimeStr,
                note: note
            };

            try {
                const result = await fetchWithAuth(`${API_BASE_URL}/bookings/request`, {
                    method: "POST",
                    body: JSON.stringify(bookingData)
                });

                closeBookingModal();

                if (result && result.booking) {
                    showToast(result.message || "Booking request sent successfully!");
                    // Refresh availability for the selected date to show the new pending status
                    const dayCell = Array.from(calendarGrid.children).find(c =>
                        c.textContent === new Date(selectedDateStr + "T00:00:00").getDate().toString() &&
                        c.classList.contains('calendar-day-cell') &&
                        c.classList.contains('selected')
                    );

                    if (dayCell) {
                        await selectDate(dayCell, selectedDateStr, true);
                    } else {
                        await selectDate(null, selectedDateStr, true); // if cell not found, still refresh
                    }

                    selectedTimeStr = null; // Clear time selection after booking attempt
                    updateBookingActionState();
                } else {
                    showToast(
                        result ?
                            (result.error || result.message || "Failed to send booking request.") :
                            "Failed to send booking request.",
                        true
                    );
                }
            } catch (error) {
                console.error("Error confirming booking:", error);
                showToast(`Error: ${error.message || "Failed to send booking request"}`, true);
            } finally {
                // Reset button state
                confirmButton.disabled = false;
                confirmButton.textContent = originalButtonText;
            }
        }

        function showToast(message, isError = false) {
            toastMessage.textContent = message;
            toastNotification.className = "toast show"; // Add 'show' class
            if (isError) {
                toastNotification.classList.add("error");
            } else {
                toastNotification.classList.remove("error");
            }
            setTimeout(() => {
                toastNotification.className = toastNotification.className.replace(" show", "");
            }, 3000);
        }

        async function joinWaitlist(courtId, date, startTime, endTime) {
            if (!courtId || !date || !startTime || !endTime) {
                showToast("Missing waitlist information.", true);
                return;
            }

            const waitlistData = {
                court_id: parseInt(courtId),
                date: date,
                start_time: startTime,
                end_time: endTime
            };

            try {
                const result = await fetchWithAuth(`${API_BASE_URL}/waitlist`, {
                    method: "POST",
                    body: JSON.stringify(waitlistData)
                });

                if (result && result.message) {
                    showToast(result.message);
                    // Optionally update the UI to indicate the user is now on the waitlist for this slot
                } else {
                    showToast(
                        result ?
                            (result.error || result.message || "Failed to join waitlist.") :
                            "Failed to join waitlist.",
                        true
                    );
                }
            } catch (error) {
                console.error("Error joining waitlist:", error);
                showToast(`Error: ${error.message || "Failed to join waitlist"}`, true);
            }
        }
