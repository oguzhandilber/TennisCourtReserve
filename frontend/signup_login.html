<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CourtReserve - Sign Up / Log In</title>
    <link rel="stylesheet" href="common_styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Page-specific styles for Sign Up / Log In Page */
        .auth-container {
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .auth-tabs {
            display: flex;
            margin-bottom: 24px;
            border: 1px solid #CED4DA; /* Light Grey */
            border-radius: 8px;
            overflow: hidden;
        }
        .auth-tab {
            padding: 12px 24px;
            cursor: pointer;
            background-color: #FFFFFF;
            color: #6C757D; /* Medium Grey */
            font-weight: 500;
            flex-grow: 1;
            text-align: center;
            border-bottom: 3px solid transparent;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }
        .auth-tab.active {
            color: #00A79D; /* Vibrant Teal */
            border-bottom-color: #00A79D; /* Vibrant Teal */
            background-color: #E0F7F6; /* Light teal tint */
        }
        .auth-form {
            width: 100%;
            max-width: 380px;
        }
        .auth-form.hidden {
            display: none;
        }
        .social-auth-divider {
            margin: 24px 0;
            text-align: center;
            color: #6C757D; /* Medium Grey */
            font-size: 14px;
            position: relative;
        }
        .social-auth-divider::before, .social-auth-divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: calc(50% - 60px);
            height: 1px;
            background-color: #CED4DA; /* Light Grey */
        }
        .social-auth-divider::before { left: 0; }
        .social-auth-divider::after { right: 0; }

        .social-auth-buttons .btn {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .social-auth-buttons .btn img {
            width: 20px;
            height: 20px;
            margin-right: 10px;
        }
        .auth-switch-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
        }
        .auth-switch-link a {
            color: #00A79D; /* Vibrant Teal */
            font-weight: 500;
            text-decoration: none;
        }
        .auth-switch-link a:hover { text-decoration: underline; }
        .error-message {
            color: red;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <a href="landing_page.html" class="logo">CourtReserve</a>
            <!-- No nav icon on auth pages usually, or a back button if applicable -->
        </header>

        <main class="auth-container">
            <div class="auth-tabs">
                <div class="auth-tab active" id="signup-tab" onclick="showForm('signup-form', 'signup-tab')">Sign Up</div>
                <div class="auth-tab" id="login-tab" onclick="showForm('login-form', 'login-tab')">Log In</div>
            </div>

            <!-- Sign Up Form -->
            <form id="signup-form" class="auth-form">
                <div class="form-group">
                    <label for="signup-name">Full Name</label>
                    <input type="text" id="signup-name" name="signup-name" class="form-input" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="signup-email">Email Address</label>
                    <input type="email" id="signup-email" name="signup-email" class="form-input" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" name="signup-password" class="form-input" placeholder="Create a password" required>
                </div>
                <div class="form-group">
                    <label for="signup-confirm-password">Confirm Password</label>
                    <input type="password" id="signup-confirm-password" name="signup-confirm-password" class="form-input" placeholder="Confirm your password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full-width mt-2">Sign Up</button>
                <div id="signup-error" class="error-message"></div>
                
                <div class="social-auth-divider">Or sign up with</div>
                <div class="social-auth-buttons">
                    <button type="button" class="btn btn-secondary btn-full-width"><img src="https://via.placeholder.com/20x20.png?text=G" alt="Google icon"> Sign Up with Google</button>
                    <button type="button" class="btn btn-secondary btn-full-width"><img src="https://via.placeholder.com/20x20.png?text=F" alt="Facebook icon"> Sign Up with Facebook</button>
                </div>
                <p class="auth-switch-link">Already have an account? <a href="#" onclick="showForm('login-form', 'login-tab'); return false;">Log In</a></p>
            </form>

            <!-- Log In Form -->
            <form id="login-form" class="auth-form hidden">
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" name="login-email" class="form-input" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="login-password" class="form-input" placeholder="Enter your password" required>
                    <p class="helper-message text-right" style="text-align: right; margin-top: 8px;"><a href="#" class="btn-tertiary" style="padding:0; font-size: 12px;">Forgot Password?</a></p>
                </div>
                <button type="submit" class="btn btn-primary btn-full-width mt-2">Log In</button>
                <div id="login-error" class="error-message"></div>

                <div class="social-auth-divider">Or log in with</div>
                <div class="social-auth-buttons">
                    <button type="button" class="btn btn-secondary btn-full-width"><img src="https://via.placeholder.com/20x20.png?text=G" alt="Google icon"> Log In with Google</button>
                    <button type="button" class="btn btn-secondary btn-full-width"><img src="https://via.placeholder.com/20x20.png?text=F" alt="Facebook icon"> Log In with Facebook</button>
                </div>
                <p class="auth-switch-link">Don't have an account? <a href="#" onclick="showForm('signup-form', 'signup-tab'); return false;">Sign Up</a></p>
            </form>
        </main>

        <footer class="app-footer">
            <p>&copy; 2025 CourtReserve. All rights reserved.</p>
        </footer>
    </div>

    <script>
        const signupForm = document.getElementById("signup-form");
        const loginForm = document.getElementById("login-form");
        const signupTab = document.getElementById("signup-tab");
        const loginTab = document.getElementById("login-tab");
        const signupErrorDiv = document.getElementById("signup-error");
        const loginErrorDiv = document.getElementById("login-error");

        const API_BASE_URL = "/api"; // Using relative URL for API requests with nginx proxy

        function showForm(formIdToShow, tabIdToActivate) {
            signupErrorDiv.textContent = ''; 
            loginErrorDiv.textContent = '';  

            if (formIdToShow === "signup-form") {
                signupForm.classList.remove("hidden");
                loginForm.classList.add("hidden");
            } else if (formIdToShow === "login-form") {
                loginForm.classList.remove("hidden");
                signupForm.classList.add("hidden");
            }

            if (tabIdToActivate === "signup-tab") {
                signupTab.classList.add("active");
                loginTab.classList.remove("active");
            } else if (tabIdToActivate === "login-tab") {
                loginTab.classList.add("active");
                signupTab.classList.remove("active");
            }
        }

        signupForm.addEventListener("submit", async function(e) {
            e.preventDefault();
            signupErrorDiv.textContent = ''; // Clear previous errors
            const fullName = document.getElementById("signup-name").value;
            const email = document.getElementById("signup-email").value;
            const password = document.getElementById("signup-password").value;
            const confirmPassword = document.getElementById("signup-confirm-password").value;

            if (password !== confirmPassword) {
                signupErrorDiv.textContent = "Passwords do not match!";
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/auth/register`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ full_name: fullName, email: email, password: password }),
                });
                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem("accessToken", data.access_token);
                    localStorage.setItem("refreshToken", data.refresh_token);
                    localStorage.setItem("user", JSON.stringify(data.user));
                    alert("Sign Up Successful! Redirecting to Dashboard...");
                    window.location.href = "dashboard.html";
                } else {
                    signupErrorDiv.textContent = data.message || "Sign up failed. Please try again.";
                }
            } catch (error) {
                console.error("Sign up error:", error);
                signupErrorDiv.textContent = "An unexpected error occurred. Please try again.";
            }
        });

        loginForm.addEventListener("submit", async function(e) {
            e.preventDefault();
            loginErrorDiv.textContent = ''; // Clear previous errors
            const email = document.getElementById("login-email").value;
            const password = document.getElementById("login-password").value;

            try {
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ email: email, password: password }),
                });
                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem("accessToken", data.access_token);
                    localStorage.setItem("refreshToken", data.refresh_token);
                    localStorage.setItem("user", JSON.stringify(data.user));
                    alert("Log In Successful! Redirecting to Dashboard...");
                    window.location.href = "dashboard.html";
                } else {
                    loginErrorDiv.textContent = data.message || "Login failed. Please check your credentials.";
                }
            } catch (error) {
                console.error("Login error:", error);
                loginErrorDiv.textContent = "An unexpected error occurred. Please try again.";
            }
        });
    </script>
</body>
</html>
