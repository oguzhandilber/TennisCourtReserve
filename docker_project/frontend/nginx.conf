server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index signup_login.html index.html index.htm; # Prioritize signup_login.html as the main entry point

    location / {
        try_files $uri $uri/ /signup_login.html; # Fallback for SPA-like behavior if needed
    }

    # Optional: Add headers to prevent caching during development
    # location ~* \.(?:css|js)$ {
    #     expires -1;
    #     add_header Pragma "no-cache";
    #     add_header Cache-Control "no-store, no-cache, must-revalidate, post-check=0, pre-check=0";
    # }
}

